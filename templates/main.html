<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Jenis Sampah Plastik</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <h1>🔍 Detektor Plastik AI</h1>
        <p>Upload foto sampah plastik kamu untuk mengetahui jenis dan cara daur ulangnya.</p>
        
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <br>
            <button type="submit">Analisis Gambar</button>
        </form>
    </div>
</body>
</html>
