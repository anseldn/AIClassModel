<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Jenis Sampah Plastik</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        h1 { color: #333; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #008CBA; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #005f7f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Detektor Plastik AI</h1>
        <p>Upload foto sampah plastik kamu untuk mengetahui jenis dan cara daur ulangnya.</p>
        
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <br>
            <button type="submit">Analisis Gambar</button>
        </form>
    </div>
</body>
</html>
